<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Celine</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #faf6f2;
            font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            color: #8b5a4b;
            font-weight: 400;
            letter-spacing: -0.2px;
            margin-bottom: 0.75rem;
            font-family: 'Georgia', serif;
        }
        .celine-name {
            display: inline-block;
            font-size: 1.2rem;
            color: #b87a6a;
            margin: 0.5rem 0;
            font-weight: 300;
            border-bottom: 1px solid #e8d9d2;
            padding-bottom: 4px;
        }
        .button-zone {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            font-size: 1.1rem;
            font-weight: 400;
            padding: 10px 32px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            background: transparent;
        }
        .btn-yes {
            background: #9abb9a;
            color: white;
            letter-spacing: 0.5px;
        }
        .btn-yes:hover { background: #86a686; }
        .btn-no {
            background: #ece0db;
            color: #8b6b60;
        }
        .btn-no:hover { background: #e2d2cb; }
        .tease {
            background: #fef8f4;
            border-radius: 20px;
            padding: 1.2rem;
            margin: 1rem 0;
            font-size: 1rem;
            color: #8b5a4b;
            animation: fadeIn 0.5s ease;
            border-left: 3px solid #dbb8ad;
            text-align: left;
            font-style: italic;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .planner {
            background: #fefcfb;
            border-radius: 24px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            text-align: left;
            border: 1px solid #f0e4de;
        }
        .hidden { display: none; }
        .form-group { margin-bottom: 1.4rem; }
        label { 
            font-weight: 400; 
            color: #8a6b60; 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            font-family: 'Georgia', serif;
        }
        
        .food-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 6px;
        }
        .food-card {
            background: white;
            border-radius: 20px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #eeded7;
        }
        .food-card.selected {
            border: 1.5px solid #b87a6a;
            background: #fef6f2;
        }
        .food-emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .food-name {
            font-size: 0.65rem;
            font-weight: 400;
            color: #9c7a6e;
        }
        
        .custom-food-group {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .custom-food-group input {
            flex: 1;
            padding: 10px 14px;
            font-size: 0.85rem;
            border: 1px solid #eeded7;
            border-radius: 40px;
            font-family: inherit;
            background: white;
        }
        .custom-food-group button {
            background: #ece0db;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: #7a5a4f;
            font-weight: 400;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #eeded7;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #cfa99b;
        }
        .date-summary {
            background: #fefaf8;
            border-radius: 28px;
            padding: 14px;
            margin: 1rem 0;
            text-align: center;
            font-size: 0.9rem;
            color: #8a6b60;
            line-height: 1.5;
            font-style: italic;
            border: 1px dashed #ecdcd5;
        }
        .confirm-btn {
            background: #b87a6a;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 400;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        .confirm-btn:hover { background: #a56858; }
        .final-msg {
            background: #f7f1ed;
            border-radius: 24px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .small-btn {
            background: #9abb9a;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 400;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .small-btn.blue { background: #b2a394; }
        .small-btn.whatsapp { background: #85a87a; }
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-moving { transition: top 0.12s ease, left 0.12s ease; }

        @media (max-width: 500px) {
            .food-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .card {
                padding: 1.8rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Celine,</h1>
    <div class="celine-name">would you like to go on a date with me?</div>

    <div class="button-zone" id="btnZone">
        <button class="btn btn-yes" id="yesBtn">yes</button>
        <button class="btn btn-no" id="noBtn">no</button>
    </div>

    <div id="teasePanel" class="tease hidden">
        I had a feeling you'd say yes.
    </div>

    <div id="planner" class="planner hidden">
        <p style="text-align:center; color:#8b5a4b; margin-bottom:1.2rem; font-style:italic;">tell me what our evening would look like</p>
        
        <div class="form-group">
            <label>what would you like to eat?</label>
            <div class="food-grid" id="foodGrid">
                <div class="food-card" data-food="Sushi"><span class="food-emoji">🍱</span><span class="food-name">Sushi</span></div>
                <div class="food-card" data-food="Pizza"><span class="food-emoji">🍕</span><span class="food-name">Pizza</span></div>
                <div class="food-card" data-food="Pasta"><span class="food-emoji">🍝</span><span class="food-name">Pasta</span></div>
                <div class="food-card" data-food="Ramen"><span class="food-emoji">🍜</span><span class="food-name">Ramen</span></div>
                <div class="food-card" data-food="Burger"><span class="food-emoji">🍔</span><span class="food-name">Burger</span></div>
                <div class="food-card" data-food="Tacos"><span class="food-emoji">🌮</span><span class="food-name">Tacos</span></div>
                <div class="food-card" data-food="Dumplings"><span class="food-emoji">🥟</span><span class="food-name">Dumplings</span></div>
                <div class="food-card" data-food="Seafood"><span class="food-emoji">🦞</span><span class="food-name">Seafood</span></div>
                <div class="food-card" data-food="Thai"><span class="food-emoji">🍛</span><span class="food-name">Thai</span></div>
                <div class="food-card" data-food="Korean"><span class="food-emoji">🥘</span><span class="food-name">Korean</span></div>
                <div class="food-card" data-food="Italian"><span class="food-emoji">🍝</span><span class="food-name">Italian</span></div>
                <div class="food-card" data-food="French"><span class="food-emoji">🥖</span><span class="food-name">French</span></div>
            </div>
            <div class="custom-food-group">
                <input type="text" id="customFood" placeholder="or something else">
                <button id="setCustomFoodBtn">add</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>where would you want to be?</label>
            <input type="text" id="place" placeholder="a quiet cafe, by the sea, somewhere warm" value="a cozy little place by the water">
        </div>
        
        <div class="form-group">
            <label>what time feels right?</label>
            <select id="time">
                <option>morning, 10am</option>
                <option>afternoon, 1pm</option>
                <option>sunset, 5:30pm</option>
                <option>evening, 7:30pm</option>
                <option selected>evening, 8pm</option>
                <option>night, 9pm</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>when should we meet?</label>
            <input type="date" id="date">
        </div>
        
        <div class="date-summary" id="summary"></div>
        <button class="confirm-btn" id="sendBtn">tell kevin</button>
        <div id="finalDiv" class="final-msg hidden"></div>
    </div>
</div>

<script>
    (function(){
        const EMAILJS_PUBLIC_KEY = "5N0NW9UzzS3wyyVQp";
        const SERVICE_ID = "service_ro22rnf";
        const TEMPLATE_ID = "template_ub93sai";
        
        emailjs.init(EMAILJS_PUBLIC_KEY);
        
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const tease = document.getElementById('teasePanel');
        const planner = document.getElementById('planner');
        const zone = document.getElementById('btnZone');
        const placeInp = document.getElementById('place');
        const timeSel = document.getElementById('time');
        const datePicker = document.getElementById('date');
        const summaryDiv = document.getElementById('summary');
        const sendBtn = document.getElementById('sendBtn');
        const finalDiv = document.getElementById('finalDiv');
        const foodGrid = document.getElementById('foodGrid');
        const customFoodInput = document.getElementById('customFood');
        const setCustomFoodBtn = document.getElementById('setCustomFoodBtn');
        
        let yesPressed = false;
        let movingActive = false;
        let confirmed = false;
        let selectedFood = "Sushi";
        
        let d = new Date();
        d.setDate(d.getDate() + 1);
        datePicker.value = d.toISOString().split('T')[0];
        
        const foodCards = document.querySelectorAll('.food-card');
        function selectFoodCard(card) {
            foodCards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedFood = card.getAttribute('data-food');
            updateSummary();
        }
        
        foodCards.forEach(card => {
            card.addEventListener('click', () => selectFoodCard(card));
            if (card.getAttribute('data-food') === "Sushi") {
                card.classList.add('selected');
            }
        });
        
        setCustomFoodBtn.addEventListener('click', () => {
            const customValue = customFoodInput.value.trim();
            if (customValue) {
                selectedFood = customValue;
                foodCards.forEach(c => c.classList.remove('selected'));
                updateSummary();
                customFoodInput.value = '';
            }
        });
        
        function getBoundaries() {
            const zoneRect = zone.getBoundingClientRect();
            const noRect = noBtn.getBoundingClientRect();
            return {
                maxX: Math.max(0, zoneRect.width - noRect.width - 10),
                maxY: Math.max(0, zoneRect.height - noRect.height - 10)
            };
        }
        
        function moveNo() {
            if (!movingActive) {
                const zoneRect = zone.getBoundingClientRect();
                const noRect = noBtn.getBoundingClientRect();
                noBtn.style.position = 'absolute';
                noBtn.style.left = (noRect.left - zoneRect.left) + 'px';
                noBtn.style.top = (noRect.top - zoneRect.top) + 'px';
                noBtn.style.margin = '0';
                noBtn.classList.add('no-moving');
                movingActive = true;
            }
            const { maxX, maxY } = getBoundaries();
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            noBtn.style.left = Math.min(maxX, Math.max(0, newX)) + 'px';
            noBtn.style.top = Math.min(maxY, Math.max(0, newY)) + 'px';
        }
        
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNo();
        });
        noBtn.addEventListener('mouseenter', () => { if (movingActive) moveNo(); });
        
        yesBtn.addEventListener('click', () => {
            if (yesPressed) return;
            yesPressed = true;
            tease.classList.remove('hidden');
            createConfetti(20);
            setTimeout(() => {
                planner.classList.remove('hidden');
                updateSummary();
                planner.scrollIntoView({ behavior: 'smooth', block: 'center' });
                createConfetti(12);
            }, 380);
            yesBtn.textContent = "yes";
        });
        
        function updateSummary() {
            const food = selectedFood;
            const place = placeInp.value.trim() || "somewhere warm";
            const time = timeSel.value;
            let dateVal = datePicker.value;
            let formattedDate = dateVal;
            if (dateVal) {
                const dateObj = new Date(dateVal);
                if (!isNaN(dateObj)) {
                    formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                }
            }
            summaryDiv.innerHTML = `${food} · ${place} · ${time} · ${formattedDate}`;
        }
        
        placeInp.addEventListener('input', updateSummary);
        timeSel.addEventListener('change', updateSummary);
        datePicker.addEventListener('change', updateSummary);
        
        async function sendEmailToKevin(details) {
            const templateParams = {
                to_email: "tiongikevin99@gmail.com",
                from_name: "Celine",
                food_choice: details.food,
                place_choice: details.place,
                time_choice: details.time,
                date_choice: details.date,
                message: "I said yes."
            };
            
            try {
                await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);
                return true;
            } catch (error) {
                console.error(error);
                return false;
            }
        }
        
        sendBtn.addEventListener('click', async () => {
            if (confirmed) {
                finalDiv.classList.remove('hidden');
                finalDiv.innerHTML = "already sent. i'll see you then.";
                return;
            }
            
            const food = selectedFood;
            const place = placeInp.value.trim() || "somewhere warm";
            const time = timeSel.value;
            let dateVal = datePicker.value;
            let displayDate = dateVal;
            if (dateVal) {
                let dateObj = new Date(dateVal);
                if (!isNaN(dateObj)) {
                    displayDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                }
            }
            
            const details = { food, place, time, date: displayDate };
            
            sendBtn.innerHTML = "sending... <span class='loading'></span>";
            sendBtn.disabled = true;
            
            const emailSent = await sendEmailToKevin(details);
            confirmed = true;
            
            const shareText = `${food} · ${place} · ${time} · ${displayDate}`;
            
            finalDiv.classList.remove('hidden');
            finalDiv.innerHTML = `
                <div style="margin-bottom:8px;">${food} · ${place} · ${time} · ${displayDate}</div>
                <div style="font-size:0.8rem; margin-bottom:8px;">${emailSent ? "kevin will see this" : "copy this and send it"}</div>
                <div class="btn-group">
                    <button class="small-btn" id="copyBtn">copy</button>
                    <button class="small-btn blue" id="shareBtn">share</button>
                    <button class="small-btn whatsapp" id="whatsappBtn">whatsapp</button>
                </div>
            `;
            
            document.getElementById('copyBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(shareText);
            });
            
            document.getElementById('shareBtn')?.addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({ title: 'our date', text: shareText });
                } else {
                    alert(shareText);
                }
            });
            
            document.getElementById('whatsappBtn')?.addEventListener('click', () => {
                window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
            });
            
            createConfetti(35);
            sendBtn.innerHTML = "date set";
            sendBtn.style.background = "#9abb9a";
            sendBtn.disabled = false;
        });
        
        function createConfetti(count = 20) {
            const petals = ['🌸', '💫', '❤️', '✨'];
            for (let i = 0; i < count; i++) {
                let div = document.createElement('div');
                div.innerText = petals[Math.floor(Math.random() * petals.length)];
                div.style.position = 'fixed';
                div.style.left = Math.random() * window.innerWidth + 'px';
                div.style.top = '-20px';
                div.style.fontSize = (Math.random() * 18 + 12) + 'px';
                div.style.pointerEvents = 'none';
                div.style.opacity = '0.6';
                div.style.zIndex = '9999';
                div.style.transition = 'transform 1.5s ease-out, opacity 1s';
                document.body.appendChild(div);
                setTimeout(() => {
                    div.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${Math.random() * 200 - 100}deg)`;
                    div.style.opacity = '0';
                    setTimeout(() => div.remove(), 1500);
                }, 10);
            }
        }
        
        window.addEventListener('resize', () => {
            if (movingActive && noBtn) {
                let left = parseFloat(noBtn.style.left);
                let top = parseFloat(noBtn.style.top);
                if (isNaN(left)) left = 0;
                if (isNaN(top)) top = 0;
                const { maxX, maxY } = getBoundaries();
                noBtn.style.left = Math.min(maxX, Math.max(0, left)) + 'px';
                noBtn.style.top = Math.min(maxY, Math.max(0, top)) + 'px';
            }
        });
        
        updateSummary();
    })();
</script>
</body>
</html>
